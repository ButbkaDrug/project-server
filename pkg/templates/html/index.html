{{ block "content" . }}
<article class="prose prose-xl lg:prose-2xl mx-auto prose-headings:text-center prose-p:uppercase prose-p:truncate">

    <div class="grid grid-cols-1 gap-2 p-4">

        {{ range . }}

        {{ if (eq .Type "hero") }}

        {{ template "hero" . }}

        {{ else }}

        {{ template "regularSection" . }}


        {{ end }}

        {{end}}

    </div>
</article>
{{ end }}
